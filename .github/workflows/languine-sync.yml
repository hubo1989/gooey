name: Languine Translation Sync

on:
  schedule:
    - cron: '0 2 * * 1'  # 每周一凌晨2点运行
  workflow_dispatch:     # 允许手动触发
  push:
    branches: [ main ]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'src/locales/en/**'

jobs:
  languine-sync:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Setup Languine
      run: |
        echo "LANGUID=${{ secrets.LANGUID }}" >> $GITHUB_ENV
        echo "LANGUINE_API_KEY=${{ secrets.LANGUINE_API_KEY }}" >> $GITHUB_ENV

    - name: Run Languine automation
      run: bun run scripts/languine-automation.sh

    - name: Create Pull Request if needed
      if: success()
      run: |
        # 检查是否有翻译文件变更
        if git diff --name-only --cached | grep -q "src/locales"; then
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add src/locales/
          git commit -m "i18n: update translations from Languine"
          git push
          
          # 这里可以添加PR创建逻辑
          echo "📝 Translation updates detected, ready for PR creation"
        else
          echo "✅ No translation updates needed"
        fi